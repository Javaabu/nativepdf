<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    @page {
        size: 300pt 260pt;
        margin: 10pt;
    }

    body {
        margin: 0;
        font-family: Helvetica;
        font-size: 8pt;
    }

    .wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 6pt;
        background: #fdf6e3;
        margin-bottom: 8pt;
    }

    .wrap > div {
        flex: 1 0 80pt;
        height: 24pt;
        background: #2aa198;
        color: #fdf6e3;
        padding: 2pt;
    }

    .col {
        display: flex;
        flex-direction: column;
        height: 120pt;
        width: 130pt;
        gap: 5pt;
        background: #eee8d5;
        float: left;
        margin-right: 8pt;
    }

    .col > div {
        background: #6c71c4;
        color: #fdf6e3;
        padding: 3pt;
    }

    .colgrow > div {
        background: #cb4b16;
    }
</style>
</head>
<body>
<div class="wrap">
    <div>one</div>
    <div>two</div>
    <div>three</div>
    <div>four</div>
    <div>five</div>
</div>
<div class="col">
    <div>first</div>
    <div style="flex: 1;">grows</div>
    <div>last</div>
</div>
<div class="col colgrow" style="flex-direction: column-reverse; justify-content: flex-start;">
    <div>bottom</div>
    <div>middle</div>
    <div>top</div>
</div>
</body>
</html>
