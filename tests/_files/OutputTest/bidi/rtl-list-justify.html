<!DOCTYPE html>

<head>

</ul>
<p class="just">שלום עולם זהו מבחן של טקסט ארוך בעברית עם מספרים 123 ו-abc באמצע כדי לבדוק יישור דו כיווני מלא של שורות טקסט. שלום עולם זהו מבחן של טקסט ארוך בעברית.</p>
